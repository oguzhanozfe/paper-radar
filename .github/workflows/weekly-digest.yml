# Optional: build the weekly digest and commit it to digests/.
# Disabled by default: it only runs when started by hand (Actions tab -> Run workflow).
# To schedule it, uncomment the `schedule:` block.
#
# Needs a GEMINI_API_KEY repository secret. Gemini's free tier embeds at most 1,000 texts
# a day, and a full week across the five default categories is ~1,200+ papers, so on the
# free tier either narrow the run (e.g. `--days 3` or fewer categories), use a paid key,
# or run on a self-hosted runner with Ollama (PAPER_RADAR_EMBED=ollama, OLLAMA_HOST).
name: Weekly digest
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1"   # Mondays 06:00 UTC
permissions:
  contents: write
jobs:
  digest:
    runs-on: ubuntu-latest   # or self-hosted with Ollama
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PAPER_RADAR_EMBED: ${{ vars.PAPER_RADAR_EMBED || 'gemini' }}
      OLLAMA_HOST: ${{ vars.OLLAMA_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m paper_radar digest --days 7
      - name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/
          git diff --cached --quiet || git commit -m "digest: $(date -u +%G-W%V)"
          git push
