name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      - name: Recompute the README eval table offline
        run: |
          python -m paper_radar eval-report
          python -m paper_radar eval-report --scores scores-qwen3emb-gptoss.json
          python -m paper_radar eval-report --scores scores-nomic-embed.json
      - name: Demo with no key and no Ollama (must resolve to replay and reproduce the committed digest)
        run: |
          python -m paper_radar demo --out-dir demo-out | tee demo.log
          grep -q "^mode: replay" demo.log
          diff demo-out/2026-11-13.md digests/2026-11-13.md
          diff demo-out/2026-11-13.html digests/2026-11-13.html
      - name: Pages site in docs/ is up to date
        run: python -m paper_radar site && git diff --exit-code docs
